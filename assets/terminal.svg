<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-label="kodyazicam@github — command examples for ctxpack, envsentinel, hookyard and svgforge">
  <rect width="720" height="160" fill="#1E1A16"/>
  <rect x="0.5" y="0.5" width="719" height="159" fill="none" stroke="#3A332A"/>
  <rect x="0" y="0" width="6" height="160" fill="#A8571B"/>

  <rect x="24" y="15" width="8" height="8" fill="#A8571B"/>
  <text x="44" y="24" fill="#B3A692" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">kodyazicam@github</text>
  <text x="696" y="24" fill="#B3A692" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="end">shell</text>
  <line x1="0" y1="38" x2="720" y2="38" stroke="#3A332A"/>

  <line x1="70" y1="38" x2="70" y2="160" stroke="#3A332A"/>
  <text x="56" y="64" fill="#B3A692" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">01</text>
  <text x="56" y="88" fill="#B3A692" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">02</text>
  <text x="56" y="112" fill="#B3A692" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">03</text>
