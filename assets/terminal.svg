  <text x="88" y="64" fill="#F4EFE3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">npx @kodyazicam/ctxpack . -o prompt.md</text>
  <text x="88" y="88" fill="#F4EFE3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">npx @kodyazicam/envsentinel check</text>
  <text x="88" y="112" fill="#F4EFE3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">hookyard --port 4242</text>
  <text x="88" y="136" fill="#F4EFE3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">npx @kodyazicam/svgforge banner --title hello</text>

