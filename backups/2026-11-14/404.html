<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Batuhan</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; --bg:#0b0912; --text:#f5f2ff; --muted:#b8aed4; --accent:#a78bfa; }
    @media (prefers-color-scheme: light) { :root { --bg:#f7f5ff; --text:#171321; --muted:#5f5870; --accent:#6d28d9; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(700px 360px at 20% 0%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 65%), var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(640px,100%); }
    .code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--accent); font-size:clamp(4rem,18vw,9rem); line-height:.9; letter-spacing:-.08em; margin:0 0 18px; }
    h1 { font-size:clamp(1.6rem,4vw,2.4rem); letter-spacing:-.03em; margin:0 0 10px; }
    p { color:var(--muted); margin:0 0 24px; }
    a { display:inline-block; padding:11px 16px; border-radius:999px; background:var(--accent); color:#fff; text-decoration:none; font-weight:650; }
    a:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page went local.</h1>
    <p>It is not in the repository, or it moved. The suite is still one click away.</p>
    <a href="/KodYazicam/">Back to the tools</a>
  </main>
</body>
</html>
